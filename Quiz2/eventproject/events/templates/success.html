<!DOCTYPE html>
<html>
<head>
    <title>Success</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .success-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        h2 {
            color: green;
        }

        a {
            text-decoration: none;
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
        }

        a:hover {
            background: #45a049;
        }
    </style>
</head>

<body>

    <div class="success-box">
        <h2>🎉 Registration Successful!</h2>
        <p>You have registered for the event.</p>

        <br>

        <a href="/">Register Again</a>
    </div>

</body>
</html>
